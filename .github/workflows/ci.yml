name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Strict type checks
        run: mypy
      - name: Offline tests with branch coverage
        run: pytest --junitxml=reports/pytest.xml
      - name: Exercise every demo report format
        run: |
          iam-audit demo --format table --output reports/demo.txt
          iam-audit demo --format json --output reports/demo.json
          iam-audit demo --format markdown --output reports/demo.md
          iam-audit schema > reports/report.schema.json
          python -c 'import json; from iam_auditor.models import Report; from pathlib import Path; r=Report.model_validate_json(Path("reports/demo.json").read_text()); assert r.summary.active == 17 and r.status == "complete"; assert json.loads(Path("reports/report.schema.json").read_text()) == json.loads(Path("docs/report.schema.json").read_text())'
      - name: Retain verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
          retention-days: 14
